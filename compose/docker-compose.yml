# Q6 - FastAPI api + Redis backend. Only the api is published (port 8000);
# redis stays on the internal compose network.
services:
  api:
    build: ./api
    ports:
      - "8000:8000"
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped
